# XcodeGen spec for the native app. The generated SimpleTodo.xcodeproj is
# committed too, so Xcode, xcodebuild, and EAS Build never need XcodeGen.
# After editing this file run `npm run xcodegen` and commit both.
name: SimpleTodo
options:
  bundleIdPrefix: com.sunrisesolutions
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    # scripts/write-build-info.sh edits the Info.plist inside the built
    # bundle, which the script sandbox would block.
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  SimpleTodo:
    type: application
    platform: iOS
    sources:
      - path: SimpleTodo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sunrisesolutions.simpletodo.native
        PRODUCT_NAME: SimpleTodo
        # An explicit plist so EAS remote versioning can write CFBundleVersion.
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: SimpleTodo/Info.plist
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
    postBuildScripts:
      - name: Stamp build provenance into Info.plist
        shell: /bin/sh
        script: |
          "${SRCROOT}/../scripts/write-build-info.sh"
        basedOnDependencyAnalysis: false
schemes:
  SimpleTodo:
    build:
      targets:
        SimpleTodo: all
    run:
      config: Debug
    archive:
      config: Release
