# ──────────────────────────────────────────────────────────────────────
# Release to TestFlight (native edition)
#
# Builds a store binary of the SwiftUI app and uploads it to TestFlight.
# A native app has no JavaScript to ship over the air, so there is no
# fingerprint check and no update job: every release is a build and a
# submit. Runs on every push to main that touches the app, so the
# TestFlight build testers hold always matches main, and on demand.
#
#   1. build:  EAS Build, `testflight` profile (store, Release)
#   2. submit: upload to TestFlight with the `testflight` submit profile
#
# Run it:
#   eas workflow:run release-testflight.yml
#
# One-time prerequisites (interactive, from your machine):
#   eas credentials -p ios                 distribution cert + profile +
#                                          App Store Connect API key
#   eas build -p ios --profile testflight --submit
#                                          first upload; creates the App
#                                          Store Connect app record
# Then put the numeric App Store Connect app id in eas.json under
# submit.testflight.ios.ascAppId so the submit job runs unattended.
# ──────────────────────────────────────────────────────────────────────
name: Release to TestFlight

on:
  push:
    branches:
      - main
    paths:
      - "ios/**"
      - "scripts/write-build-info.sh"
      - "eas.json"
  workflow_dispatch: {}

# A new push to main must not cancel an upload that is mid-flight.
concurrency:
  group: ${{ workflow.filename }}-${{ github.ref }}
  cancel_in_progress: false

jobs:
  build:
    name: 1. Build iOS (store)
    type: build
    params:
      platform: ios
      profile: testflight
      message: TestFlight release

  submit:
    name: 2. Upload to TestFlight
    type: submit
    needs: [build]
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      profile: testflight

  done:
    name: 3. Uploaded
    type: doc
    needs: [submit]
    params:
      md: |
        # 📲 Build `${{ needs.build.outputs.build_id }}` is on its way to TestFlight

        App Store Connect processes it for a few minutes, then testers get
        the update. Feedback and crashes from this build come back through
        testflight-feedback.yml and testflight-crash.yml.
